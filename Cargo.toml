[package]
name = "logfowd2"
version = "0.5.1"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.151"
bytes = "1.12.1"
futures = "0.3.34"
libc = "0.2.189"
async-trait = "0.1.92"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
async-channel = "2.5.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
prometheus = "0.14.0"
axum = "0.8.9"
tower = "0.5.3"
thiserror = "2.0.21"
anyhow = "1.0.104"

[dependencies.uuid]
version = "1.26.1"
features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
]
